<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bard — Shakespearean English</title>
  <style>
    :root {
      --bg: #1a1612;
      --panel: #252019;
      --text: #e8e0d5;
      --muted: #9a8f82;
      --accent: #c9a227;
      --accent-dim: #8a7020;
      --border: #3d3428;
      --error: #c45c5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: radial-gradient(ellipse 120% 80% at 50% -20%, #2d261c, var(--bg));
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    header { margin-bottom: 1.75rem; }
    h1 {
      font-size: 1.65rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 0 0 0.35rem;
      color: var(--accent);
    }
    .tagline { color: var(--muted); font-size: 0.95rem; }
    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    textarea {
      width: 100%;
      min-height: 8rem;
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1rem;
    }
    button {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.55rem 1.35rem;
      cursor: pointer;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 6px;
      font-weight: 600;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .hint { font-size: 0.85rem; color: var(--muted); }
    .out-block {
      margin-top: 2rem;
      padding: 1.1rem 1.2rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      min-height: 4rem;
    }
    .out-block pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      font-size: 1.02rem;
    }
    .err {
      color: var(--error);
      font-size: 0.95rem;
      margin-top: 0.75rem;
    }
    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Bard</h1>
      <p class="tagline">Turn modern English into Shakespearean-style prose — powered by OpenAI.</p>
    </header>

    <section>
      <label for="src">Thy modern speech</label>
      <textarea id="src" placeholder="Write or paste a sentence here…"></textarea>
      <div class="row">
        <button type="button" id="go">Translate</button>
        <span class="hint">Calls the model only when thou click’st.</span>
      </div>
      <p class="err" id="err" hidden></p>
    </section>

    <section class="out-block" aria-live="polite">
      <label for="out">The rendering</label>
      <pre id="out" class="empty">The quill hath not yet moved.</pre>
    </section>
  </div>

  <script>
    const src = document.getElementById("src");
    const out = document.getElementById("out");
    const go = document.getElementById("go");
    const err = document.getElementById("err");

    function setError(msg) {
      err.hidden = !msg;
      err.textContent = msg || "";
    }

    async function translate() {
      const text = src.value.trim();
      setError("");
      if (!text) {
        out.textContent = "";
        out.className = "empty";
        out.textContent = "Speak plainly first — the box is empty.";
        return;
      }
      go.disabled = true;
      out.className = "";
      out.textContent = "The quill stirreth…";
      try {
        const res = await fetch("/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const d = data.detail;
          const msg =
            typeof d === "string"
              ? d
              : Array.isArray(d)
                ? d.map((x) => x.msg || JSON.stringify(x)).join("; ")
                : res.statusText || "Request failed";
          throw new Error(msg);
        }
        const t = (data.translation || "").trim();
        out.textContent = t || "(The model returned naught.)";
        if (!t) out.className = "empty";
      } catch (e) {
        out.className = "empty";
        out.textContent = "Alas, the chamber is silent.";
        setError(e.message || String(e));
      } finally {
        go.disabled = false;
      }
    }

    go.addEventListener("click", translate);
    src.addEventListener("keydown", (ev) => {
      if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter") translate();
    });
  </script>
</body>
</html>
