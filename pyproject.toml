[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shakespeare-openai"
version = "0.1.0"
description = "Convert modern English to Shakespearean-style English via OpenAI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bard = "shakespeare_app.cli:main"
bard-web = "shakespeare_app.web_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shakespeare_app = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
